services:
  postgres:
    image: postgres:15-alpine
    container_name: gym-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gym-network

  reverse-proxy:
    image: nginx:alpine
    container_name: gym-reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./active_color.env:/etc/nginx/active_color.env:ro
    env_file:
      - ./active_color.env
    depends_on:
      - postgres
    networks:
      - gym-network

volumes:
  pgdata:

networks:
  gym-network:
    driver: bridge
