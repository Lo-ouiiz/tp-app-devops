name: CI Pipeline

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

jobs:

  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Lint frontend
        working-directory: ./frontend
        run: npm install && npm run lint

      - name: Lint backend
        working-directory: ./backend
        run: npm install && npm run lint

  build:
    name: Build
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build frontend
        working-directory: ./frontend
        run: npm install && npm run build

      - name: Build backend
        working-directory: ./backend
        run: npm install && npm run build

  test:
    name: Tests
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies backend
        working-directory: ./backend
        run: npm install

      - name: Run tests
        working-directory: ./backend
        run: npm run test

  sonar:
    name: Sonarcloud
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=Lo-ouiiz_tp-app-devops
            -Dsonar.organization=lo-ouiiz
            -Dsonar.sources=src
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -X

  docker:
    name: Docker build & push
    runs-on: self-hosted
    needs: sonar
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker images
        run: |
          docker build -t backend-ci ./backend
          docker build -t frontend-ci ./frontend

      - name: Test Docker containers
        run: |
          docker run -d --name backend-test backend-ci
          docker run -d --name frontend-test frontend-ci
          sleep 5
          docker ps | grep backend-test
          docker ps | grep frontend-test
          docker stop backend-test frontend-test
          docker rm backend-test frontend-test

      - name: Tag & push images to GHCR
        run: |
          REPO_OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          docker tag backend-ci ghcr.io/$REPO_OWNER_LOWER/cloudnative-backend:${GITHUB_SHA}
          docker tag frontend-ci ghcr.io/$REPO_OWNER_LOWER/cloudnative-frontend:${GITHUB_SHA}
          docker push ghcr.io/$REPO_OWNER_LOWER/cloudnative-backend:${GITHUB_SHA}
          docker push ghcr.io/$REPO_OWNER_LOWER/cloudnative-frontend:${GITHUB_SHA}

  deploy:
    name: Deploy with docker compose
    runs-on: self-hosted
    needs: docker
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file for deployment
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
          echo "SEED_DB=${{ secrets.SEED_DB }}" >> .env

      - name: Run deployment script
        run: chmod +x scripts/deploy.sh && ./scripts/deploy.sh
