  docker:
    name: Docker build & push
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker images
        run: |
          docker build -t backend-ci ./backend
          docker build -t frontend-ci ./frontend

      - name: Test Docker containers
        run: |
          docker run -d --name backend-test backend-ci
          docker run -d --name frontend-test frontend-ci
          sleep 5
          docker ps | grep backend-test
          docker ps | grep frontend-test
          docker stop backend-test frontend-test
          docker rm backend-test frontend-test

      - name: Tag & push images to GHCR
        run: |
          REPO_OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          docker tag backend-ci ghcr.io/$REPO_OWNER_LOWER/cloudnative-backend:${GITHUB_SHA}
          docker tag frontend-ci ghcr.io/$REPO_OWNER_LOWER/cloudnative-frontend:${GITHUB_SHA}
          docker push ghcr.io/$REPO_OWNER_LOWER/cloudnative-backend:${GITHUB_SHA}
          docker push ghcr.io/$REPO_OWNER_LOWER/cloudnative-frontend:${GITHUB_SHA}

  deploy:
    name: Deploy with docker compose
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deployment script
        run: chmod +x scripts/deploy.sh && ./scripts/deploy.sh
