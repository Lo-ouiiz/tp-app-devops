name: CI Pipeline

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

jobs:

  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Lint frontend
        working-directory: ./frontend
        run: npm install && npm run lint

      - name: Lint backend
        working-directory: ./backend
        run: npm install && npm run lint

  build:
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build frontend
        working-directory: ./frontend
        run: npm install && npm run build

      - name: Build backend
        working-directory: ./backend
        run: npm install && npm run build

  test:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies backend
        working-directory: ./backend
        run: npm install

      - name: Run tests
        working-directory: ./backend
        run: npm run test

  sonar:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=Lo-ouiiz_tp-app-devops
            -Dsonar.organization=lo-ouiiz
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
