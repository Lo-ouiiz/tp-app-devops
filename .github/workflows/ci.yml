name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Lint frontend
        working-directory: ./frontend
        run: npm install && npm run lint

      - name: Lint backend
        working-directory: ./backend
        run: npm install && npm run lint

  build:
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build frontend
        working-directory: ./frontend
        run: npm install && npm run build

      - name: Build backend
        working-directory: ./backend
        run: npm install && npm run build

  test:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies backend
        working-directory: ./backend
        run: npm install

      - name: Run tests
        working-directory: ./backend
        run: npm test

  sonar:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies backend
        working-directory: ./backend
        run: npm install

      - name: SonarCloud Scan
        working-directory: ./backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Commande pour lancer l'analyse SonarCloud
          # à adapter selon ton projet
          npx sonar-scanner \
            -Dsonar.login=$SONAR_TOKEN
