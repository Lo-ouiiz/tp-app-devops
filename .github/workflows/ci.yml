name: CI Pipeline

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

jobs:

  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Lint frontend
        working-directory: ./frontend
        run: npm install && npm run lint

      - name: Lint backend
        working-directory: ./backend
        run: npm install && npm run lint

  build:
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build frontend
        working-directory: ./frontend
        run: npm install && npm run build

      - name: Build backend
        working-directory: ./backend
        run: npm install && npm run build

  test:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies backend
        working-directory: ./backend
        run: npm install

      - name: Run tests
        working-directory: ./backend
        run: npm run test

  sonar:
    name: SonarCloud
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          useDocker: false
          args: >
            -Dsonar.projectKey=Lo-ouiiz_tp-app-devops
            -Dsonar.organization=lo-ouiiz
            -Dsonar.sources=src
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -X
  
  docker:
    name: Docker build & push
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build backend Docker image
        run: docker build -t backend-ci ./backend

      - name: Build frontend Docker image
        run: docker build -t frontend-ci ./frontend

      - name: Test backend container
        run: |
          docker run -d --name backend-test backend-ci
          sleep 5
          docker ps | grep backend-test
          docker stop backend-test
          docker rm backend-test

      - name: Test frontend container
        run: |
          docker run -d --name frontend-test frontend-ci
          sleep 5
          docker ps | grep frontend-test
          docker stop frontend-test
          docker rm frontend-test

      - name: Tag & push backend
        run: |
          docker tag backend-ci ghcr.io/${{ github.repository_owner }}/cloudnative-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/cloudnative-backend:${{ github.sha }}

      - name: Tag & push frontend
        run: |
          docker tag frontend-ci ghcr.io/${{ github.repository_owner }}/cloudnative-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/cloudnative-frontend:${{ github.sha }}
